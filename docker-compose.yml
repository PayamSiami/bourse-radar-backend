version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bourse-postgres
    environment:
      POSTGRES_USER: bourse
      POSTGRES_PASSWORD: bourse123
      POSTGRES_DB: bourse_radar
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bourse -d bourse_radar"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bourse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: bourse-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://bourse:bourse123@postgres:5432/bourse_radar"
      REDIS_URL: "redis://redis:6379"
    restart: unless-stopped

volumes:
  pg_data:
